[package]
name = "yichat-desktop"
version = "0.1.0"
description = "YiChat desktop shell for Windows and Linux"
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
name = "yichat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "gzip", "json", "http2"] }
http = "1"
url = "2"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
subtle = "2"
regex = "1"
once_cell = "1"
log = "0.4"
open = "5"
rfd = "0.15"
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
scrypt = { version = "0.11", default-features = false }
aes-gcm = "0.10"
zeroize = "1"
hex = "0.4"
tauri-plugin-updater = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"
notify-rust = { version = "4", default-features = false, features = ["d"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation", "Foundation_Collections", "Win32_UI_Shell"] }
winreg = "0.56"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
