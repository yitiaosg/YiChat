<section style="background:#112744;border:1px solid #315578;border-radius:16px;padding:20px;margin-bottom:20px;text-align:center">
{% if yidt_daily.bound %}<button type="button" id="yidt-claim" class="btn-primary" data-csrf="{{session._yidt_csrf}}" style="width:100%;font-size:24px;padding:18px" {% if yidt_daily.checked %}disabled{% endif %}>{{'已签' if yidt_daily.checked else '签到'}}</button>{% else %}<a class="btn-primary" href="https://yidt.yitiao.org/services/daily/" style="display:block;font-size:24px;padding:18px">签到</a>{% endif %}
<p>{{'今日已领' if yidt_daily.checked else '今日可领'}} {{yidt_daily.amount}} YIDT{% if yidt_daily.tx %} · <a style="display:inline-block;white-space:nowrap" href="https://yidt.yitiao.org/explorer/tx/{{yidt_daily.tx}}">领取详情</a>{% endif %}</p>
<p>连续 {{yidt_daily.streak}} 天 · <a href="https://yidt.yitiao.org/services/daily/">{{'管理' if yidt_daily.bound else '绑定'}}收款钱包</a></p><p id="yidt-claim-status" role="status" style="margin:0"></p></section><script src="/static/yidt-daily.js"></script>
