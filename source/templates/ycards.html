<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YCards · Yitiao</title><link rel="icon" href="/static/logo.ico"><link rel="stylesheet" href="/static/ycards.css"><script src="/static/yidt-bridge.js"></script></head>
<body>
<header class="yc-header"><div class="brand-nav"><a href="/" class="brand" aria-label="返回 Yitiao 首页"><img src="/static/logo.svg" alt="">YCards</a><nav aria-label="YCards 栏目" id="navigation"><a href="?tab=market" data-tab="market">交易</a><a href="?tab=auction" data-tab="auction">拍卖</a><a href="?tab=create" data-tab="create">创作</a><a href="?tab=production" data-tab="production">生产</a><a href="?tab=mine" data-tab="mine">我的</a></nav></div>
<div class="account-tools"><a id="balance" class="balance" href="/points/">{{ ('%.2f' % (boot.balance_cents / 100)) if boot.balance_cents is not none else '—' }} <small>YIDT</small></a><span id="auction-held" class="hint" hidden></span><a id="task-progress" href="?tab=production" hidden></a><a href="?tab=auction-history" id="auction-history-link">拍卖历史</a><a href="?tab=history" id="history-link">历史交易</a>{% if user %}<a class="user-chip" href="/account/">{% if avatar_url %}<img class="avatar-sm" src="{{ avatar_url }}" alt="">{% else %}<span class="avatar-sm">{{ user.username[0] | upper }}</span>{% endif %}<span class="uname">{{ user.username }}</span></a>{% else %}<a class="login-btn" href="/login/?next=/ycards/">Log in</a>{% endif %}</div></header>
<main id="content" tabindex="-1"><div class="empty">正在加载 YCards…</div></main>
<div id="toast" role="status" aria-live="polite" hidden></div><dialog id="modal"><button class="dialog-close" aria-label="关闭">×</button><div id="modal-content"></div></dialog>
<script id="yc-boot" type="application/json">{{ boot | tojson }}</script><script src="/static/ycards-render.js" defer></script><script src="/static/ycards-cache.js" defer></script><script src="/static/parachute-qrcode.js" defer></script><script src="/static/ycards-share.js" defer></script><script src="/static/ycards-auctions.js" defer></script><script src="/static/ycards-save.js" defer></script><script src="/static/ycards.js" defer></script></body></html>
