<!doctype html>
<html lang="zh-CN">
<head>
<link rel="stylesheet" href="/static/login-button.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Parachute{% endblock %} · Yitiao</title>
<style>
:root{--bg:#050d20;--panel:#101d37;--panel2:#152544;--line:#294264;--text:#eef6ff;--muted:#9db2cc;--cyan:#69cbff;--gold:#ffc875;--green:#53dda9;--red:#ff7185}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#16336a 0,#07142c 50%,#050d20 100%);color:var(--text);font:16px system-ui,-apple-system,"Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}.top{min-height:68px;display:flex;align-items:center;justify-content:space-between;padding:10px max(18px,calc((100% - 1080px)/2));gap:12px;background:#08152bea;border-bottom:1px solid #36517277;backdrop-filter:blur(12px)}.brand-wrap,.topright{display:flex;align-items:center;gap:9px}.brand{font-size:21px;font-weight:900;letter-spacing:.04em}.logo-link img{width:32px;height:32px;display:block}.topright{flex-wrap:wrap;justify-content:flex-end}.points,.user,.nav-link{display:flex;align-items:center;justify-content:center;gap:8px;min-height:38px;border:1px solid #385476;border-radius:999px;padding:5px 12px;background:#172b4b;font-weight:750;white-space:nowrap}.points{color:var(--gold)}.nav-link{color:#d9eaff;width:38px;height:38px;padding:0;border-radius:50%}.nav-link svg{width:20px;height:20px}.nav-link.trophy{color:var(--gold)}.nav-link.active{background:#285580;border-color:#6da9db}.points:hover,.user:hover,.nav-link:hover{background:#203e65}.user{padding:4px 11px 4px 5px}.avatar{height:30px;width:30px;border-radius:50%;object-fit:cover;background:#3b83c1;display:grid;place-items:center}.wrap{max-width:1080px;margin:auto;padding:30px 18px 72px}.page-head{margin:0 0 22px}.page-head h1{font-size:clamp(30px,5vw,46px);margin:0 0 5px}.muted{color:var(--muted)}.page-head p{margin:0}.card{border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 18px 50px #0006;padding:21px}.list{display:grid;gap:12px}.record{display:flex;align-items:center;justify-content:space-between;gap:18px;border:1px solid #304968;border-radius:14px;background:#152644;padding:17px 18px}.record-main{min-width:0}.record-title{font-weight:800;font-size:18px}.record-meta{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.5}.record-side{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap}.score{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}.positive{color:var(--green)}.negative{color:var(--red)}.neutral{color:var(--muted)}.button{border:1px solid #577da6;border-radius:10px;padding:9px 13px;background:#203b62;color:#e5f4ff;font-weight:750}.button:hover{background:#2d5687}.button.primary{background:linear-gradient(135deg,#63c9fa,#257bd8);color:#061b38;border:0}.button:disabled{opacity:.55;cursor:wait}.empty{text-align:center;color:var(--muted);padding:45px 12px}.tabs{display:flex;gap:9px;margin-bottom:16px}.tabs button.active{background:#285580;border-color:#6da9db}.rank-row{display:grid;grid-template-columns:48px minmax(130px,1fr) minmax(90px,auto) minmax(118px,auto);gap:14px;align-items:center;padding:13px 8px;border-bottom:1px solid #304968}.rank-row:last-child{border-bottom:0}.rank-number{color:var(--gold);font-weight:900;text-align:center}.player{display:flex;align-items:center;gap:10px;min-width:0}.player img,.player .avatar{width:34px;height:34px;flex:none}.player-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:750}.rank-detail{color:var(--muted);font-size:13px;text-align:right}.rank-score{text-align:right}@media(max-width:700px){.top{flex-wrap:wrap;padding:9px 11px}.topright{width:100%;gap:5px}.brand{font-size:16px}.logo-link img{width:28px;height:28px}.points,.user{font-size:12px;padding:5px 9px}.nav-link{width:34px;height:34px}.user .name{display:none}.record{align-items:flex-start;flex-direction:column}.record-side{justify-content:flex-start}.rank-row{grid-template-columns:36px minmax(90px,1fr) minmax(90px,auto);gap:8px}.rank-detail{display:none}.score{font-size:18px}}
</style>
{% block head %}{% endblock %}
<script src="/static/yidt-bridge.js"></script></head>
<body>
<header class="top"><div class="brand-wrap"><a class="logo-link" href="/" aria-label="返回主站"><img src="/static/logo.svg" alt="Yitiao"></a><a class="brand" href="/games/parachute/">Parachute</a></div><div class="topright">{% if username %}<a class="points" href="/points/">✦ {{ balance }}</a>{% endif %}<a class="nav-link {% if active_nav == 'history' %}active{% endif %}" href="/games/parachute/history/" title="历史记录" aria-label="历史记录"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></a><a class="nav-link trophy {% if active_nav == 'ranking' %}active{% endif %}" href="/games/parachute/ranking/" title="排行榜" aria-label="排行榜"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="6"/><path d="M8.5 13.5 7 22l5-3 5 3-1.5-8.5"/></svg></a>{% if username %}<a class="user" href="/account/">{% if avatar_url %}<img class="avatar" src="{{ avatar_url }}" alt="">{% else %}<span class="avatar">{{ username[0]|upper }}</span>{% endif %}<span class="name">{{ username }}</span></a>{% else %}<a class="login-btn" href="/login/?next=/games/parachute/">Log in</a>{% endif %}</div></header>
<main class="wrap">{% block content %}{% endblock %}</main>
{% block script %}{% endblock %}
</body></html>
