<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ card.name if card else '链接不可用' }} · YCards</title><meta name="robots" content="noindex"><link rel="stylesheet" href="/static/ycards.css"></head><body>
<header class="yc-header"><a class="brand" href="/ycards/">YCards</a><a href="/ycards/">浏览交易市场</a></header>
{% if card %}<main class="yc-public"><p class="eyebrow">SHARED CARD</p><h1>{{ card.name }}</h1><p class="cid">{{ card.cid }}</p><div id="public-card" class="card-stage interactive-drag"></div><p id="public-status" role="status">正在加载卡片…</p><p class="helper">悬停或拖动旋转卡片。公开链接在卡片转手后自动失效。</p></main>
<script id="public-boot" type="application/json">{{ card|tojson }}</script><script src="/static/ycards-render.js" defer></script><script src="/static/ycards-cache.js" defer></script><script src="/static/ycards-public.js" defer></script>{% else %}<main class="yc-public"><h1>暂时无法查看这张卡片</h1><p>{{ error }}</p><a href="/ycards/">返回 YCards</a></main>{% endif %}</body></html>
